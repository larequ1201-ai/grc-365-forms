<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ultra&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">
<title>Untitled Document</title>
<style>
    @font-face {
        font-family: "Ultra", serif, "Alata", sans-serif;
        src: url("Ultra/Ultra-Regular.ttf");
		src:url("Alata/Alata-Regular.ttf")
		
    } h1 {
        text-align: center;
        font-weight: normal;
		font-family: "Ultra", serif;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: #9BFAFF;
        margin: 36px auto;
        border: 1px solid goldenrod;
        box-shadow: 2px 3px 6px plum;
        border-radius: 18px;
        font: 14pt/1.2em;
		font-family: "Alata", sans-serif;
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
	} input[type="text"] {
		width: 98%;
		font-family: "Ultra", serif;
		font: 15pt/1.4em;
		
	} select {
		font: 12pt/1.4em;
		font-family: "Alata", sans-serif;
		padding: 2px 4px;
	} textarea {
		width: 98%;
	} input[type="submit"] {
		font-family: "Ultra", serif;
		box-shadow: 2px 3px;
    }
</style>
</head>

<body>
    <form action="https://formsubmit.co/quirol4@unlv.nevada.edu" method="post">
    <h1>Contact Us</h1>
	<input type="text" name="first-name" /><br/>
	<label>First name</label><br/>
	<input type="text" name="last-name"/><br/>
	<label>Last name</label><br/>
	<input type="text" name="email"/><br/>
	<label>Email</label><br/><br/>
	
	<fieldset>
	<legend>Operating System</legend>
	<input type="radio" name="os" /><label>Mac OS</label><br/>
	<input type="radio" name="os" /><label>Windows</label><br/>
	<input type="radio" name="os" /><label>UNIX</label><br/>
	</fieldset>
	
	<fieldset>
	<legend>Services Desired</legend>
	<input type="checkbox"><label>Design</label><br/>
	<input type="checkbox"><label>UX/UI</label><br/>
	<input type="checkbox"><label>Consulting</label><br/>
	</fieldset><br/>
	
	<label>What is your timeframe?</label><br/>
	<select>
		<option>ASAP</option>
		<option>This week</option>
		<option>This month</option>
		<option>This year</option>
	</select>
	<br/><br/>
	
	<label>Comments</label><br/>
	<textarea>
	</textarea><br/><br/>
	
	<input type="submit" value="Submit" />
    </form>
</body>
</html>
